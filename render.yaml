services:
  - type: web
    name: thermoshelter-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: KEEP_AWAKE_INTERVAL_SECONDS
        value: "600"
